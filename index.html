<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        /* 全体の設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #ffffff;
            /* 背景にお気に入りの風景画像を設定（※URLはサンプルです） */
            background: url('C:\\Users\\yusuk\\OneDrive\\画像\\アルバム\\プロ研\\2024夏合宿\\image0 - コピー.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* 最初の画面（ファーストビュー） */
        .hero-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 薄く四角で区切ったキリッとしたボックス */
        .profile-box {
            background-color: rgba(0, 0, 0, 0.6); /* 黒の半透明（白っぽくするなら rgba(255,255,255,0.2) など） */
            padding: 40px 60px;
            border: 2px solid #ffffff; /* 白い直線でキリッとさせる */
            border-radius: 0px; /* 角を丸めず、キリッと尖らせる */
            backdrop-filter: blur(5px); /* 背景の風景を少しぼかして文字を読みやすくする */
        }

        .profile-box h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .scroll-arrow {
            margin-top: 30px;
            font-size: 0.9rem;
            animation: bounce 2s infinite;
        }

        /* 下にスクロールした先のセクション */
        .menu-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.4); /* スクロール先を少し暗くして落ち着かせる */
        }

        .menu-section h2 {
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* ほかのページに飛ぶ選択肢（ナビゲーション） */
        .menu-container {
            display: flex;
            gap: 30px; /* 選択肢の間隔 */
        }

        .menu-item {
            display: inline-block;
            width: 200px;
            padding: 20px;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease; /* マウスを乗せた時の変化をなめらかに */
        }

        /* マウスを乗せた（ホバーした）ときのアクション */
        .menu-item:hover {
            background-color: #ffffff;
            color: #000000;
            transform: translateY(-5px); /* ひょこっと上に動く */
        }

        /* 矢印を上下にふわふわ動かすアニメーション（CSSだけ） */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        /* 画面の横幅が 768px 以下（スマホ・タブレット）のときだけ適用 */
        @media (max-width: 768px) {
            body {
                /* スマホで見栄えが良い「縦長」の風景画像のURLに差し替える */
                background-image: url('C:\\Users\\yusuk\\OneDrive\\画像\\アルバム\\プロ研\\2024夏合宿\\image0.jpg');
            }
            
            /* ついでにスマホだと四角いボックスが大きすぎる場合、少し小さく調整 */
            .profile-box {
                padding: 20px 30px; 
                width: 90%; /* 画面の横幅いっぱいに広がらないようにする */
            }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="profile-box">
            <h1>ゆけペーーーージ‼</h1>
            <p>のんびり生活したい‼</p>
            <div class="scroll-arrow">▼ Scroll Down</div>
        </div>
    </section>

    <section class="menu-section">
        <h2>CONTENTS</h2>
        <div class="menu-container">
            <a href="about.html" class="menu-item">ABOUT ME</a>
            <a href="works.html" class="menu-item">WORKS</a>
            <a href="blog.html" class="menu-item">BLOG</a>
        </div>
    </section>

</body>
</html>
